# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# smart pane switching with awareness of vim splits
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# tmux colors
set -g default-terminal "tmux-256color"

# Enable OSC 52 clipboard integration (works over SSH)
set -s set-clipboard on

# integrate with system clipboard through xclip if installed
if-shell "command -v xclip >/dev/null 2>&1" \
    'bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"'

# Set zsh as default shell if installed
if-shell "[ -x /bin/zsh ]" 'set -g default-shell "/bin/zsh"'

# Include local tmux configs if they exist
if-shell "[ -f ~/.tmux.local.conf ]" "source-file ~/.tmux.local.conf"
